name: Validate presentation

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run dependency-free presentation tests
        run: npm test
      - name: Upload presentation preview
        uses: actions/upload-artifact@v4
        with:
          name: presentation-preview
          path: |
            index.html
            assets
            scripts
            slides
            styles
          if-no-files-found: error
          retention-days: 7

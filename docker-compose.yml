name: von-presentation

services:
  presentation:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
